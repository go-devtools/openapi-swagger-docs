name: Documentation CI and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.3.4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source and particle contracts
        run: pnpm check && pnpm test
      - name: Build static pages and verify links
        run: pnpm build
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify actual browser behavior
        run: pnpm test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-documentation
          path: dist/
          retention-days: 7
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Verify the configured public URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: test "$PAGES_URL" = 'https://go-devtools.github.io/openapi-swagger-docs'
      - name: Publish verified documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
